name: Faktaport

on:
  push:
  pull_request:

jobs:
  sjekk-fakta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sjekk at faktaverdier ikke står hardkodet
        run: node scripts/sjekk-fakta.mjs
